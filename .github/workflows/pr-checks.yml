name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # PR Size Check
  size-check:
    name: Check PR Size
    runs-on: ubuntu-latest

    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changedFiles = pr.changed_files;
            const additions = pr.additions;
            const deletions = pr.deletions;

            let label = null;
            if (changedFiles > 100 || additions > 1000) {
              label = 'size/XL';
              core.warning('⚠️ Large PR detected. Consider breaking it down into smaller PRs.');
            } else if (changedFiles > 30 || additions > 500) {
              label = 'size/L';
            } else if (changedFiles > 10 || additions > 200) {
              label = 'size/M';
            } else {
              label = 'size/S';
            }

            core.info(`PR size: ${label}`);
            core.info(`Files changed: ${changedFiles}`);
            core.info(`Additions: ${additions}`);
            core.info(`Deletions: ${deletions}`);

  # Test Coverage Check
  coverage-check:
    name: Check Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage comment
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # Build Check
  build-check:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Comment build size
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function getDirectorySize(dirPath) {
              let size = 0;
              const files = fs.readdirSync(dirPath);

              files.forEach(file => {
                const filePath = path.join(dirPath, file);
                const stats = fs.statSync(filePath);

                if (stats.isDirectory()) {
                  size += getDirectorySize(filePath);
                } else {
                  size += stats.size;
                }
              });

              return size;
            }

            const distSize = getDirectorySize('dist');
            const sizeMB = (distSize / (1024 * 1024)).toFixed(2);

            core.info(`Build size: ${sizeMB} MB`);

  # Accessibility Check
  accessibility-check:
    name: Accessibility Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run accessibility tests
        run: npm run test:e2e tests/e2e/accessibility.spec.ts

  # TypeScript Check
  typescript-check:
    name: TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check
